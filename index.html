<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURSA FABRICS AND TAILOR</title>
    
    <!-- Font Awesome (واٹس ایپ اور لاگ ان آئیکنز کے لیے) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase v8.10.1 (Stable CDN) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; padding: 15px; margin: 0; }
        
        /* ------------ جدید اور خوبصورت لاگ ان اسکرین ------------ */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 380px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #d4af37, #f39c12);
        }

        .login-brand-icon {
            font-size: 42px;
            color: #d4af37;
            margin-bottom: 10px;
            display: inline-block;
            background: #fdf6e3;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .login-card h2 {
            margin: 5px 0 5px 0;
            color: #1a252f;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .login-card p.subtitle {
            margin: 0 0 25px 0;
            color: #7f8c8d;
            font-size: 13px;
        }

        .login-field {
            margin-bottom: 18px;
            text-align: right;
            position: relative;
        }

        .login-field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 12px;
            color: #95a5a6;
            font-size: 15px;
        }

        .login-field input {
            width: 100%;
            padding: 12px 38px 12px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
            background: #f9fbfd;
        }

        .login-field input:focus {
            border-color: #3498db;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #1f618d, #2980b9);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        #loginError {
            color: #e74c3c;
            background: #fde8e8;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #f8b4b4;
            font-weight: bold;
            font-size: 12px;
            margin-top: 15px;
            display: none;
        }

        /* اصلی فارم */
        .receipt { 
            display: none; 
            position: relative; 
            max-width: 1100px; 
            width: 95%; 
            margin: 20px auto; 
            background: #ffffff; 
            padding: 25px; 
            border: 1px solid #dcdcdc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        /* لاگ آؤٹ بٹن */
        .logout-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.2s;
            z-index: 10;
        }
        .logout-btn:hover { background: #c0392b; }

        /* ہیڈر کی سیٹنگ */
        .header { 
            text-align: center; 
            border-bottom: 2px dashed #333; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            padding-left: 100px;
            padding-right: 100px;
        }
        .header h3 { 
            margin: 0 0 5px 0; 
            font-size: 22px; 
            color: #2c3e50; 
            word-break: break-word;
        }

        .header .phone-container {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 5px;
        }

        .header .phone-num {
            margin: 2px 0;
            font-weight: bold;
            color: #444;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            direction: ltr;
        }

        .whatsapp-icon {
            color: #25D366;
            font-size: 16px;
            width: 20px;
            text-align: center;
            margin-right: 5px;
        }

        .icon-spacer {
            width: 20px;
            display: inline-block;
            margin-right: 5px;
        }

        .location-qr-container {
            position: absolute;
            top: 15px;
            right: 15px;
            text-align: center;
            background: #fff;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 5;
        }
        .location-qr-container img {
            width: 75px;
            height: 75px;
            display: block;
        }
        .location-qr-container span {
            font-size: 9px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-top: 2px;
        }

        .form-grid { display: flex; flex-wrap: wrap; justify-content: space-between; }
        .row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .row label { font-weight: bold; width: 42%; color: #34495e; }
        .row input, .row select { width: 55%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; background-color: #fafafa; }
        .section-title { width: 100%; background: #34495e; color: #ffffff; font-weight: bold; text-align: center; padding: 8px; margin: 15px 0 12px 0; font-size: 15px; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 5px; }
        
        .print-note { display: none; }

        .pemaish-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        @media (min-width: 769px) {
            .pemaish-col { width: 48%; }
            .basic-info .row { width: 48%; }
            .basic-info { display: flex; flex-wrap: wrap; justify-content: space-between; width: 100%; }
        }

        /* ------------ موبائل ویو کی خاص سیٹنگ ------------ */
        @media (max-width: 768px) { 
            .receipt { max-width: 100%; padding: 12px; margin: 0 auto; } 
            
            .logout-btn { 
                position: static;
                margin-bottom: 10px;
                padding: 6px 12px; 
                font-size: 11px;
                width: auto;
                float: left;
            }

            .location-qr-container { 
                position: static;
                float: right;
                margin-bottom: 10px;
                padding: 2px;
            }
            .location-qr-container img { width: 55px; height: 55px; }
            .location-qr-container span { font-size: 7px; }

            .header { 
                clear: both;
                padding-left: 0;
                padding-right: 0;
                text-align: center;
                padding-top: 10px;
            } 
            .header h3 { 
                font-size: 16px; 
                line-height: 1.4; 
                margin-top: 5px;
            } 
            .header .phone-num { font-size: 12px; }

            .pemaish-container { flex-direction: column !important; }
            .pemaish-col { width: 100% !important; }
            .row { width: 100% !important; margin-bottom: 8px; } 
            .row label { width: 40%; font-size: 13px; } 
            .row input, .row select { width: 58%; font-size: 13px; padding: 5px; } 
        }

        /* ---------------- پرنٹنگ سیٹنگ ---------------- */
        @media print { 
            #loginOverlay { display: none !important; }
            @page {
                size: A5 portrait;
                margin: 5mm; 
            }
            body { 
                background: #fff; 
                padding: 0; 
                margin: 0; 
                -webkit-print-color-adjust: exact; 
            }
            .btn, .no-print, .logout-btn { 
                display: none !important; 
            } 
            .receipt { 
                display: block !important;
                border: none !important; 
                width: 100% !important; 
                max-width: 100% !important; 
                box-shadow: none !important; 
                padding: 0 !important; 
                margin: 0 !important; 
            } 
            .header {
                padding-bottom: 5px;
                margin-bottom: 8px;
                padding-left: 0 !important;
                padding-right: 65px !important;
                text-align: center !important;
                clear: both !important;
            }
            .header h3 { font-size: 16px !important; }
            .header .phone-num { font-size: 11px !important; }
            .location-qr-container {
                position: absolute !important;
                top: 0 !important;
                right: 0 !important;
                padding: 2px !important;
                float: none !important;
            }
            .location-qr-container img {
                width: 55px !important;
                height: 55px !important;
            }
            .section-title {
                padding: 3px;
                margin: 6px 0 6px 0;
                font-size: 12px;
                background: #34495e !important;
                color: #fff !important;
            }

            .empty-field-print { display: none !important; }

            body:not(.karigar-mode) .print-note {
                display: block !important;
                text-align: center;
                font-size: 11px;
                font-weight: bold;
                color: #000;
                margin-top: 12px;
                padding-top: 6px;
                border-top: 1px dashed #444;
            }

            body:not(.karigar-mode) .hide-on-print, 
            body:not(.karigar-mode) .hide-on-print * {
                display: none !important;
                height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            body.karigar-mode .hasab-section,
            body.karigar-mode .hasab-title,
            body.karigar-mode .print-note {
                display: none !important;
            }

            body.karigar-mode .pemaish-container {
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                width: 100% !important;
            }
            body.karigar-mode .pemaish-col { width: 48% !important; }

            .basic-info {
                display: flex !important;
                flex-wrap: wrap !important;
                flex-direction: row !important;
            }
            .basic-info .row, .hasab-section .row, .pemaish-col .row { 
                width: 48% !important; 
                margin-bottom: 3px !important; 
                font-size: 11px !important; 
            } 
            .pemaish-col .row { width: 100% !important; }
            .row label { 
                width: 45% !important; 
                font-size: 11px !important; 
            } 
            .row input, .row select { 
                width: 52% !important; 
                font-size: 11px !important; 
                padding: 2px 4px !important; 
                border: 1px solid #aaa !important; 
                background: transparent !important;
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                appearance: none !important;
            }
        }
    </style>
</head>
<body>

<!-- لاگ ان کارڈ -->
<div id="loginOverlay">
    <div class="login-card">
        <div class="login-brand-icon">
            <i class="fa-solid fa-scissors"></i>
        </div>
        <h2>BURSA FABRICS</h2>
        <p class="subtitle">ٹیلرنگ منیجمنٹ سسٹم</p>

        <div class="login-field">
            <label>صارف کا نام (Username):</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="userInput" placeholder="Username درج کریں">
            </div>
        </div>

        <div class="login-field">
            <label>پاس ورڈ (Password):</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="passInput" placeholder="Password درج کریں">
            </div>
        </div>

        <button class="login-btn" onclick="checkLogin()">
            <i class="fa-solid fa-right-to-bracket" style="margin-left: 6px;"></i> لاگ ان کریں
        </button>

        <div id="loginError">
            <i class="fa-solid fa-circle-exclamation"></i> غلط صارف نام یا پاس ورڈ!
        </div>
    </div>
</div>

<div class="receipt" id="mainReceipt">
    <!-- لاگ آؤٹ بٹن -->
    <button type="button" class="logout-btn no-print" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> لاگ آؤٹ
    </button>

<!-- QR کوڈ -->
<div class="location-qr-container">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BURSA%20FABRICS%20AND%20TAILOR%0A%D8%AE%D8%A7%D9%86%DA%A9%DB%8C%20%D8%B1%D9%88%DA%88%20%D8%A8%D9%84%D9%85%D9%82%D8%A7%D8%A8%D9%84%20%D8%AC%D9%86%D8%A7%D8%B2%DB%81%20%DA%AF%D8%A7%DB%81%20%D8%B3%D8%A7%D8%B1%D9%88%DA%A9%DB%8C%20%DA%8C%DB%8C%D9%85%DB%81" alt="Shop QR Code">
    <span>ایڈریس کیو آر</span>
</div>

    <div class="header">
        <h3>BURSA FABRICS AND TAILOR</h3>
        <div class="phone-container">
            <p class="phone-num">
                <i class="fab fa-whatsapp whatsapp-icon"></i>
                <span>03451530130</span>
            </p>
            <p class="phone-num">
                <span class="icon-spacer"></span>
                <span>03041530130</span>
            </p>
        </div>
    </div>

    <!-- سرچ بار -->
    <div class="no-print" style="background: #eef2f3; padding: 12px; margin-bottom: 15px; border-radius: 6px; text-align: center; border: 1px solid #d5dbdb;">
        <input type="text" id="searchPhone" placeholder="گاہک کا فون نمبر..." style="width: 45%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
        <button type="button" id="searchBtn" onclick="searchCustomer()" style="padding: 7px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;">تلاش کریں</button>
        
        <div id="searchResultsDiv" style="display: none; margin-top: 10px;">
            <label style="font-weight: bold; font-size: 13px;">نام منتخب کریں: </label>
            <select id="customerSelect" onchange="onCustomerSelected()" style="width: 60%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
            </select>
        </div>
    </div>

    <!-- فارم -->
    <form id="tailorForm">
        <input type="hidden" id="oldCustomerKey">
        
        <!-- بنیادی معلومات -->
        <div class="basic-info">
            <div class="row"><label>نام:</label><input type="text" id="name"></div>
            <div class="row"><label>فون نمبر:</label><input type="text" id="phone"></div>
            <div class="row"><label>بکنگ تاریخ:</label><input type="date" id="bookingDate"></div>
            <div class="row"><label>واپسی تاریخ:</label><input type="date" id="returnDate"></div>
            <div class="row"><label>سلائی:</label><select id="stitching"><option value="سنگل">سنگل</option><option value="ڈبل">ڈبل</option></select></div>
             
            <div class="row">
                <label>اسٹیٹس:</label>
                <select id="suitStatus">
                    <option value="جاری">جاری ہے </option>
                    <option value="مکمل">مکمل ہو گیا </option>
                </select>
            </div>
            <div class="row">
                <label>سوٹ کی تعداد:</label>
                <select id="suitQty">
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
            <div class="row"><label>گاؤں :</label><input type="text" id="gaon"></div>
        </div>

        <!-- قمیض کی پیمائش (عنوان) -->
        <div class="section-title hide-on-print">قمیض کی پیمائش</div>

        <!-- قمیض کے لیے دو الگ کالمز -->
        <div class="pemaish-container hide-on-print">
            <div class="pemaish-col">
                <div class="row"><label>لمبائی:</label><input type="text" id="shirtLen"></div>
                <div class="row"><label>بازو:</label><input type="text" id="bazu"></div> 
                <div class="row"><label>تیرا:</label><input type="text" id="teera"></div> 
                <div class="row"><label>چھاتی:</label><input type="text" id="chest"></div>
                <div class="row"><label>تختی:</label><input type="text" id="takhti"></div> 
                <div class="row"><label>کمر:</label><input type="text" id="kamar"></div>   
                <div class="row"><label>دامن سائيز:</label><input type="text" id="daman"></div> 
                <div class="row"><label>گلا:</label><input type="text" id="gala"></div>
                <div class="row"><label>گلا قسم:</label><select id="galaType"><option value=" بین">بین</option><option value="کالر">کالر</option></select></div>
                <div class="row"><label>موڈا:</label><input type="text" id="moda"></div>
                <div class="row"><label>کف سائز:</label><input type="text" id="cuff"></div>        
                </div>

            <div class="pemaish-col">
                <div class="row"><label>کہنی:</label><input type="text" id="kuhni"></div> 
            
                <div class="row"><label>کندھا:</label><input type="text" id="kandha"></div>
                <div class="row"><label>سامنے جیب:</label><select id="frontPocket"><option value="ہاں">ہاں</option><option value="نہیں">نہیں</option></select></div>
                <div class="row"><label>سامنے جیب کا ڈیزائن:</label><select id="frontPocketDesign"><option value="نہیں">نہیں</option><option value="ہاں">ہاں</option></select></div>
                <div class="row"><label>سائیڈ جیب:</label><select id="sidePocket"><option value="1">1</option><option value="2">2</option></select></div>
                <div class="row"><label>دامن قسم:</label><select id="damanType"><option value="گول">گول</option><option value="چورس">چورس</option></select></div>
                <div class="row"><label>کالر نوک:</label><select id="collarNok"><option value="فرینچ">فرینچ</option><option value="گول">گول</option></select></div>        
                
                <div class="row"><label>بین:</label><select id="ban"><option value="سادہ">سادہ</option><option value="ڈیزائن">ڈیزائن</option></select></div>
                <div class="row"><label>کف ڈیزائن:</label><select id="cuffDesign"><option value="گول">گول</option><option value="چورس">چورس</option></select></div>        
                <div class="row"><label>چاک پٹی بٹن:</label><select id="chakpatiButton"><option value="نہیں">نہیں</option><option value="ہاں">ہاں</option></select></div>
                <div class="row"><label>دھاگہ :</label><select id="dhaga"><option value="سادہ">سادہ</option><option value="سلکی">سلکی</option></select></div>        
            </div>
        </div>

        <!-- شلوار کی پیمائش (عنوان) -->
        <div class="section-title hide-on-print">شلوار کی پیمائش</div>

        <!-- شلوار کے لیے دو الگ کالمز -->
        <div class="pemaish-container hide-on-print">
            <div class="pemaish-col">
                <div class="row"><label>شلوار لمبائی:</label><input type="text" id="shalwarLen"></div>
                <div class="row"><label>گھیرا:</label><input type="text" id="ghera"></div>
                <div class="row"><label>آسن:</label><input type="text" id="asan"></div>    
                <div class="row"><label>شلوار جیب:</label><select id="shalwarPocket"><option value="ہاں">ہاں</option><option value="نہیں">نہیں</option></select></div>
            </div>

            <div class="pemaish-col">
                <div class="row"><label>پانچہ:</label><input type="text" id="panja"></div>      
                <div class="row"><label>جالی:</label><select id="jaali"><option value="نہیں">نہیں</option><option value="ہاں">ہاں</option></select></div>
                <div class="row"><label>پانچہ ڈیزائن:</label><select id="panchaDesign"><option value="نہیں">نہیں</option><option value="ہاں">ہاں</option></select></div>
            </div>
        </div>

        <!-- حساب کتاب سیکشن -->
        <div class="section-title hasab-title">حساب کتاب</div>
        <div class="hasab-section basic-info">
            <div class="row"><label>کل رقم:</label><input type="text" id="totalAmount" oninput="calculateBalance()" placeholder="0"></div>
            <div class="row"><label>ایڈوانس:</label><input type="text" id="advanceAmount" oninput="calculateBalance()" placeholder="0"></div>
            <div class="row"><label>بقایا رقم:</label><input type="text" id="remainingAmount" readonly placeholder="0" style="background-color: #e9ecef; font-weight: bold;"></div>
            <div class="row"><label>دستخط: </label></div>
        </div>

        <!-- پرنٹ کے لیے نوٹ -->
        <div class="print-note">
            نوٹ: برائے مہربانی مقررہ تاریخ کے بعد 30 دن کے اندر اندر اپنا سوٹ لے جائیں اس کے بعد ہم ذمہ دار نہ ہوں گے۔شکریہ 
        </div>

        <!-- بٹنز -->
        <button type="button" class="btn no-print" style="background: #27ae60;" onclick="saveData()">ڈیٹا محفوظ کریں / اپ ڈیٹ کریں</button>
        <button type="button" class="btn no-print" style="background: #e67e22;" onclick="printReceipt()">پرنٹ کریں (کسٹمر)</button>
        <button type="button" class="btn no-print" style="background: #2980b9;" onclick="printKarigar()">پرنٹ کاریگر</button>
        <button type="button" class="btn no-print" style="background: #25D366;" onclick="sendWhatsApp()">واٹس ایپ پر میسج بھیجیں</button>
        <button type="button" class="btn no-print" style="background: #c0392b;" onclick="resetForm()"><i class="fa-solid fa-rotate-right" style="margin-left: 5px;"></i> فارم صاف کریں / ریفریش</button>
    </form>
</div>

<script>
// ------------- فائر بیس اور لاگ ان لاجک -------------

const firebaseConfig = {
    apiKey: "AIzaSyDgbMDgt40YlJ7X4xdkX6uhS0CFLNBOTJs",
    authDomain: "bursa-fabrics.firebaseapp.com",
    databaseURL: "https://bursa-fabrics-default-rtdb.firebaseio.com", 
    projectId: "bursa-fabrics",
    storageBucket: "bursa-fabrics.firebasestorage.app",
    messagingSenderId: "293685540433",
    appId: "1:293685540433:web:29a3cdf2c01ddf2e486a70"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// چیک کریں کہ کیا پہلے سے لاگ ان ہے
auth.onAuthStateChanged((user) => {
    if (user) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainReceipt').style.display = 'block';
    } else {
        document.getElementById('mainReceipt').style.display = 'none';
        document.getElementById('loginOverlay').style.display = 'flex';
    }
});

function checkLogin() {
    let u = document.getElementById('userInput').value.trim();
    let p = document.getElementById('passInput').value.trim();
    let err = document.getElementById('loginError');

    if (!u || !p) {
        err.style.display = 'block';
        return;
    }

    let fakeEmail = u + "@bursafabrics.com";

    auth.signInWithEmailAndPassword(fakeEmail, p)
        .then((userCredential) => {
            err.style.display = 'none';
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
        })
        .catch((error) => {
            console.error(error);
            err.style.display = 'block';
        });
}

function logout() {
    auth.signOut().then(() => {
    }).catch((error) => {
        console.error(error);
    });
}

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        if (document.getElementById('loginOverlay').style.display !== 'none') {
            checkLogin();
        }
    }
});

// ------------- فارم لاجک -------------
let currentSearchResults = [];

function calculateBalance() {
    let total = parseFloat(document.getElementById('totalAmount').value) || 0;
    let advance = parseFloat(document.getElementById('advanceAmount').value) || 0;
    let balance = total - advance;
    document.getElementById('remainingAmount').value = balance >= 0 ? balance : 0;
}

function cleanNumber(num) {
    if (!num) return '';
    return String(num).replace(/[^0-9]/g, '');
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    let d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toISOString().split('T')[0];
}

function resetForm() {
    document.getElementById('tailorForm').reset();
    document.getElementById('oldCustomerKey').value = '';
    document.getElementById('searchPhone').value = '';
    document.getElementById('searchResultsDiv').style.display = 'none';
    document.getElementById('customerSelect').innerHTML = '';
    document.getElementById('suitQty').value = '1';
    document.getElementById('remainingAmount').value = '';
    currentSearchResults = [];
}

function hideEmptyFields() {
    let allInputs = document.querySelectorAll('#tailorForm input');
    allInputs.forEach(input => {
        let parentRow = input.closest('.row');
        if (parentRow) {
            let val = input.value ? input.value.trim() : '';
            if (val === '') {
                parentRow.classList.add('empty-field-print');
            } else {
                parentRow.classList.remove('empty-field-print');
            }
        }
    });
}

function restoreEmptyFields() {
    let allRows = document.querySelectorAll('.row');
    allRows.forEach(row => {
        row.classList.remove('empty-field-print');
    });
}

function printReceipt() {
    document.body.classList.remove('karigar-mode');
    hideEmptyFields();
    window.print();
    setTimeout(() => {
        restoreEmptyFields();
    }, 1000);
}

function printKarigar() {
    document.body.classList.add('karigar-mode');
    hideEmptyFields();
    window.print();
    setTimeout(() => {
        document.body.classList.remove('karigar-mode');
        restoreEmptyFields();
    }, 1000);
}

function saveData() {
    let nameElement = document.getElementById('name');
    let phoneElement = document.getElementById('phone');
    
    let name = nameElement ? nameElement.value.trim() : "";
    let phone = phoneElement ? phoneElement.value.trim() : "";

    if (!name || !phone) {
        alert("براہ کرم گاہک کا نام اور فون نمبر دونوں درج کریں!");
        return;
    }

    let cleanPh = cleanNumber(phone);
    if (cleanPh.length < 10) {
        alert("براہ کرم درست فون نمبر درج کریں!");
        return;
    }

    let formData = {
        name: name,
        phone: phone,
        cleanPhone: cleanPh,
        bookingDate: document.getElementById('bookingDate').value,
        returnDate: document.getElementById('returnDate').value,
        stitching: document.getElementById('stitching').value,
        suitStatus: document.getElementById('suitStatus').value,
        suitQty: document.getElementById('suitQty').value,
        gaon: document.getElementById('gaon').value,
        shirtLen: document.getElementById('shirtLen').value,
        bazu: document.getElementById('bazu').value,
        teera: document.getElementById('teera').value,
        chest: document.getElementById('chest').value,
        takhti: document.getElementById('takhti').value,
        kamar: document.getElementById('kamar').value,
        daman: document.getElementById('daman').value,
        gala: document.getElementById('gala').value,
        galaType: document.getElementById('galaType').value,
        moda: document.getElementById('moda').value,
        cuff: document.getElementById('cuff').value,
        kuhni: document.getElementById('kuhni').value,
        kandha: document.getElementById('kandha').value,
        frontPocket: document.getElementById('frontPocket').value,
        frontPocketDesign: document.getElementById('frontPocketDesign').value,
        sidePocket: document.getElementById('sidePocket').value,
        damanType: document.getElementById('damanType').value,
        collarNok: document.getElementById('collarNok').value,
        ban: document.getElementById('ban').value,
        cuffDesign: document.getElementById('cuffDesign').value,
        chakpatiButton: document.getElementById('chakpatiButton').value,
        dhaga: document.getElementById('dhaga').value,
        shalwarLen: document.getElementById('shalwarLen').value,
        ghera: document.getElementById('ghera').value,
        asan: document.getElementById('asan').value,
        shalwarPocket: document.getElementById('shalwarPocket').value,
        panja: document.getElementById('panja').value,
        jaali: document.getElementById('jaali').value,
        panchaDesign: document.getElementById('panchaDesign').value,
        totalAmount: document.getElementById('totalAmount').value,
        advanceAmount: document.getElementById('advanceAmount').value,
        remainingAmount: document.getElementById('remainingAmount').value
    };

    let oldKey = document.getElementById('oldCustomerKey').value;
    let customerRef = db.ref('customers');

    if (oldKey) {
        customerRef.child(oldKey).set(formData).then(() => {
            alert("ڈیٹا کامیابی سے اپ ڈیٹ ہو گیا ہے!");
        }).catch((error) => {
            alert("خرابی پیش آئی: " + error.message);
        });
    } else {
        let newRef = customerRef.push();
        newRef.set(formData).then(() => {
            document.getElementById('oldCustomerKey').value = newRef.key;
            alert("ڈیٹا کامیابی سے محفوظ ہو گیا ہے!");
        }).catch((error) => {
            alert("خرابی پیش آئی: " + error.message);
        });
    }
}

function searchCustomer() {
    let searchVal = document.getElementById('searchPhone').value.trim();
    if (!searchVal) {
        alert("تلاش کے لیے فون نمبر یا نام درج کریں!");
        return;
    }

    let cleanSearch = cleanNumber(searchVal);
    let dbRef = db.ref('customers');

    dbRef.once('value', (snapshot) => {
        let results = [];
        snapshot.forEach((childSnapshot) => {
            let data = childSnapshot.val();
            let key = childSnapshot.key;
            
            let matchPhone = cleanSearch && data.cleanPhone && data.cleanPhone.includes(cleanSearch);
            let matchName = data.name && data.name.toLowerCase().includes(searchVal.toLowerCase());

            if (matchPhone || matchName) {
                results.push({ key: key, ...data });
            }
        });

        if (results.length === 0) {
            alert("کوئی ریکارڈ نہیں ملا!");
            document.getElementById('searchResultsDiv').style.display = 'none';
            return;
        }

        currentSearchResults = results;
        let selectTag = document.getElementById('customerSelect');
        selectTag.innerHTML = '<option value="">-- نام منتخب کریں --</option>';

        results.forEach((item, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${item.name} (${item.phone})`;
            selectTag.appendChild(opt);
        });

        document.getElementById('searchResultsDiv').style.display = 'block';
        if (results.length === 1) {
            selectTag.value = "0";
            onCustomerSelected();
        }
    });
}

function onCustomerSelected() {
    let idx = document.getElementById('customerSelect').value;
    if (idx === "") return;

    let customer = currentSearchResults[idx];
    if (!customer) return;

    document.getElementById('oldCustomerKey').value = customer.key;
    document.getElementById('name').value = customer.name || '';
    document.getElementById('phone').value = customer.phone || '';
    document.getElementById('bookingDate').value = formatDate(customer.bookingDate) || '';
    document.getElementById('returnDate').value = formatDate(customer.returnDate) || '';
    document.getElementById('stitching').value = customer.stitching || 'سنگل';
    document.getElementById('suitStatus').value = customer.suitStatus || 'جاری';
    document.getElementById('suitQty').value = customer.suitQty || '1';
    document.getElementById('gaon').value = customer.gaon || '';
    
    document.getElementById('shirtLen').value = customer.shirtLen || '';
    document.getElementById('bazu').value = customer.bazu || '';
    document.getElementById('teera').value = customer.teera || '';
    document.getElementById('chest').value = customer.chest || '';
    document.getElementById('takhti').value = customer.takhti || '';
    document.getElementById('kamar').value = customer.kamar || '';
    document.getElementById('daman').value = customer.daman || '';
    document.getElementById('gala').value = customer.gala || '';
    document.getElementById('galaType').value = customer.galaType || 'بین';
    document.getElementById('moda').value = customer.moda || '';
    document.getElementById('cuff').value = customer.cuff || '';
    document.getElementById('kuhni').value = customer.kuhni || '';
    document.getElementById('kandha').value = customer.kandha || '';
    document.getElementById('frontPocket').value = customer.frontPocket || 'ہاں';
    document.getElementById('frontPocketDesign').value = customer.frontPocketDesign || 'نہیں';
    document.getElementById('sidePocket').value = customer.sidePocket || '1';
    document.getElementById('damanType').value = customer.damanType || 'گول';
    document.getElementById('collarNok').value = customer.collarNok || 'فرینچ';
    document.getElementById('ban').value = customer.ban || 'سادہ';
    document.getElementById('cuffDesign').value = customer.cuffDesign || 'گول';
    document.getElementById('chakpatiButton').value = customer.chakpatiButton || 'نہیں';
    document.getElementById('dhaga').value = customer.dhaga || 'سادہ';

    document.getElementById('shalwarLen').value = customer.shalwarLen || '';
    document.getElementById('ghera').value = customer.ghera || '';
    document.getElementById('asan').value = customer.asan || '';
    document.getElementById('shalwarPocket').value = customer.shalwarPocket || 'ہاں';
    document.getElementById('panja').value = customer.panja || '';
    document.getElementById('jaali').value = customer.jaali || 'نہیں';
    document.getElementById('panchaDesign').value = customer.panchaDesign || 'نہیں';

    document.getElementById('totalAmount').value = customer.totalAmount || '';
    document.getElementById('advanceAmount').value = customer.advanceAmount || '';
    document.getElementById('remainingAmount').value = customer.remainingAmount || '';
}

function sendWhatsApp() {
    let phone = document.getElementById('phone').value.trim();
    let name = document.getElementById('name').value.trim();
    let returnDate = document.getElementById('returnDate').value.trim();
    let remaining = document.getElementById('remainingAmount').value.trim() || '0';

    if (!phone) {
        alert("واٹس ایپ پر بھیجنے کے لیے فون نمبر موجود ہونا ضروری ہے!");
        return;
    }

    let cleanPh = cleanNumber(phone);
    if (cleanPh.startsWith('0')) {
        cleanPh = '92' + cleanPh.substring(1);
    }

    let msg = `السلام علیکم ${name}! آپ کا سوٹ BURSA FABRICS AND TAILOR پر تیار ہو رہا ہے۔ واپسی کی تاریخ: ${returnDate} ہے۔ بقایا رقم: ${remaining} روپے ہے۔ شکریہ!`;
    let url = `https://wa.me/${cleanPh}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
}
</script>

</body>
</html>
